# ============================================
# GitHub Actions CI/CD Pipeline
# ============================================
# Triggered on every push to main branch.
# Steps: Test → Build Docker Image → Simulate Registry Push
# ============================================

name: ML API CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      # ---- Step 1: Checkout Code ----
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---- Step 2: Setup Python ----
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      # ---- Step 3: Install Dependencies ----
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Step 4: Run Linting (Optional) ----
      - name: Code quality check
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E501,W503 --count --show-source --statistics
        continue-on-error: true

      # ---- Step 5: Run Unit Tests ----
      - name: Run pytest test suite
        run: |
          pytest tests/ -v --tb=short

      # ---- Step 6: Build Docker Image ----
      - name: Build Docker image
        run: |
          docker build -t ml-api:${{ github.sha }} .
          docker images ml-api

      # ---- Step 7: Simulate Registry Push ----
      - name: Simulate container registry push
        run: |
          echo "============================================"
          echo "SIMULATING DOCKER PUSH"
          echo "============================================"
          echo "Image: ml-api:${{ github.sha }}"
          echo "Registry: docker.io/username/ml-api (simulated)"
          echo "Status: Push simulated successfully"
          echo ""
          echo "In production, this step would execute:"
          echo "  docker login -u \$DOCKER_USERNAME -p \$DOCKER_PASSWORD"
          echo "  docker tag ml-api:\$GITHUB_SHA docker.io/username/ml-api:latest"
          echo "  docker push docker.io/username/ml-api:latest"
          echo "============================================"
